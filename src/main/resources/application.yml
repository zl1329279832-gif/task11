server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/clinic_appointment?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000ms

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.clinic.appointment.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.clinic.appointment: DEBUG

# ---- Appointment business config ----
appointment:
  # Max waitlist size per slot
  max-waitlist-size: 10
  # Minutes before auto-cancel unsigned appointment
  auto-cancel-minutes: 30
  # Minutes for passed-number recall
  pass-recall-minutes: 15
  # Lock wait timeout in seconds
  lock-wait-seconds: 5
