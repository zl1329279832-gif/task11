spring:
  datasource:
    url: jdbc:h2:mem:clinic_test;MODE=MYSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  data:
    redis:
      host: localhost
      port: 6379

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

appointment:
  max-waitlist-size: 5
  auto-cancel-minutes: 30
  pass-recall-minutes: 15
  lock-wait-seconds: 3
